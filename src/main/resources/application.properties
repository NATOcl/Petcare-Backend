spring.application.name=petcare-backend
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:PetcareBackendClaveSecretaSuperSegura2026ParaFirmarTokensJWTCon256Bits}
jwt.expiration=86400000

# Orígenes permitidos para CORS (permite tu frontend en GitHub Pages y desarrollo local)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://natocl.github.io,http://localhost:5500,http://localhost:3000,http://localhost:5173}

# Base de datos H2 en memoria
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:petcare}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Consola H2 (solo útil en local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway y validación de esquema JPA
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate