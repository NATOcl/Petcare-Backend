spring.application.name=petcare-backend
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:Y2xhdmVSeXRjVjcmV0YS1kZS1sVtcGxvLTMyLW5gVzLw1pbmltbw==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Orígenes permitidos para CORS (permite tu frontend en GitHub Pages y desarrollo local)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://natocl.github.io,http://localhost:5500,http://localhost:3000,http://localhost:5173}

# Base de datos H2 en memoria
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:petcare}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true